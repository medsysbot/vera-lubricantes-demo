<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#020812">
<title>VERA Lubricantes</title>
<style>
:root{--gold:#d8a34f;--red:#ff3348}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;width:100%;min-height:100%;background:#02060b;color:#fff;font-family:system-ui,-apple-system,Segoe UI,sans-serif;overflow-x:hidden}
body{min-height:100dvh;display:grid;place-items:center;background:radial-gradient(circle at 50% 30%,#0b1724 0,#02060b 58%,#000 100%)}
.stage{width:100%;min-height:100dvh;display:grid;place-items:center;padding:max(10px,env(safe-area-inset-top)) 10px max(10px,env(safe-area-inset-bottom));position:relative}
.phone{position:relative;width:min(94vw,430px);aspect-ratio:400/711;border-radius:7.2%/4.1%;overflow:hidden;background:#020812;box-shadow:0 26px 80px #000,0 0 0 1px #ffffff0e;touch-action:manipulation}
.screen{position:absolute;inset:0;display:none;background-repeat:no-repeat;background-size:400% 200%;background-color:#020812}
.screen.on{display:block}
.home{background-position:0 0}.splash{background-position:33.333% 0}.scan{background-position:66.667% 0}.vehicle{background-position:100% 0}.messages{background-position:0 100%}.history{background-position:33.333% 100%}.detail{background-position:66.667% 100%}
.hot{position:absolute;border:0;background:transparent;padding:0;cursor:pointer;z-index:5}
.hot:focus{outline:0}
#loading{position:absolute;inset:0;z-index:20;display:grid;place-items:center;background:#020812;transition:opacity .35s ease}
#loading.hide{opacity:0;pointer-events:none}
.loader{width:74px;height:2px;background:#ffffff1d;overflow:hidden}
.loader:after{content:"";display:block;width:40%;height:100%;background:linear-gradient(90deg,transparent,var(--gold),transparent);animation:load 1s infinite}
@keyframes load{from{transform:translateX(-120%)}to{transform:translateX(330%)}}
.scan-beam{position:absolute;z-index:4;left:21%;right:20%;height:2px;top:47%;background:linear-gradient(90deg,transparent,#ff3a4d 15%,#ff5a66 50%,#ff3a4d 85%,transparent);box-shadow:0 0 8px #ff3348,0 0 18px #ff334888;animation:scanline 1.9s ease-in-out infinite;pointer-events:none}
@keyframes scanline{0%,100%{top:38%;opacity:.7}50%{top:64%;opacity:1}}
.home-open{left:10%;top:57%;width:28%;height:17%}
.scan-read{left:19%;top:30%;width:66%;height:46%}.scan-manual{left:17%;top:84%;width:69%;height:9%}
.vehicle-history{left:13%;top:68%;width:75%;height:7%}.vehicle-detail{left:13%;top:76%;width:75%;height:7%}.vehicle-msg-bell{right:8%;top:8%;width:13%;height:10%}.vehicle-msg-card{left:13%;top:84%;width:75%;height:10%}
.messages-back{left:4%;top:8%;width:14%;height:9%}.messages-vehicle{left:3%;bottom:1%;width:20%;height:10%}
.history-back{left:5%;top:7%;width:14%;height:9%}.history-detail{right:8%;top:31%;width:31%;height:10%}
.detail-back{left:4%;top:7%;width:14%;height:9%}
.side-link{position:fixed;right:12px;bottom:12px;z-index:30;color:#d7ae62;text-decoration:none;font-size:12px;letter-spacing:.04em;padding:9px 12px;border:1px solid #d7ae6238;border-radius:999px;background:#07111dcc;backdrop-filter:blur(10px);opacity:.58;transition:.2s}
.side-link:hover{opacity:1}
@media(max-width:520px){body{display:block}.stage{padding:0;min-height:100dvh}.phone{width:100vw;max-width:none;border-radius:0;min-height:100dvh;aspect-ratio:auto}.screen{background-size:400% 200%;background-position-y:var(--py,0);background-origin:border-box}.home{background-position:0 0}.splash{background-position:33.333% 0}.scan{background-position:66.667% 0}.vehicle{background-position:100% 0}.messages{background-position:0 100%}.history{background-position:33.333% 100%}.detail{background-position:66.667% 100%}.side-link{display:none}}
</style>
</head>
<body>
<div class="stage">
  <div class="phone" id="phone" aria-label="Demo interactiva VERA Lubricantes">
    <div id="loading"><div class="loader"></div></div>
    <section class="screen home on" data-screen="home">
      <button class="hot home-open" data-go="splash" aria-label="Abrir VERA"></button>
    </section>
    <section class="screen splash" data-screen="splash">
      <button class="hot" style="inset:0" data-go="scan" aria-label="Continuar"></button>
    </section>
    <section class="screen scan" data-screen="scan">
      <div class="scan-beam"></div>
      <button class="hot scan-read" data-go="vehicle" aria-label="Escanear QR"></button>
      <button class="hot scan-manual" data-go="vehicle" aria-label="Ingresar código manual"></button>
    </section>
    <section class="screen vehicle" data-screen="vehicle">
      <button class="hot vehicle-msg-bell" data-go="messages" aria-label="Mensajes"></button>
      <button class="hot vehicle-history" data-go="history" aria-label="Ver historial completo"></button>
      <button class="hot vehicle-detail" data-go="detail" aria-label="Último servicio"></button>
      <button class="hot vehicle-msg-card" data-go="messages" aria-label="Mensajes y promociones"></button>
    </section>
    <section class="screen messages" data-screen="messages">
      <button class="hot messages-back" data-go="vehicle" aria-label="Volver"></button>
      <button class="hot messages-vehicle" data-go="vehicle" aria-label="Mi vehículo"></button>
    </section>
    <section class="screen history" data-screen="history">
      <button class="hot history-back" data-go="vehicle" aria-label="Volver"></button>
      <button class="hot history-detail" data-go="detail" aria-label="Ver detalle"></button>
    </section>
    <section class="screen detail" data-screen="detail">
      <button class="hot detail-back" data-go="history" aria-label="Volver al historial"></button>
    </section>
  </div>
</div>
<a class="side-link" href="admin.html">Panel administrador</a>
<script>
const parts=['assets/clientopt.00','assets/clientopt.01','assets/clientopt.02','assets/clientopt.03','assets/clientopt.04','assets/clientopt.05','assets/clientopt.06'];
const screens=[...document.querySelectorAll('.screen')];
let current='home',splashTimer;
function go(name){
  clearTimeout(splashTimer);
  const next=document.querySelector('[data-screen="'+name+'"]');
  if(!next)return;
  screens.forEach(s=>s.classList.toggle('on',s===next));
  current=name;
  if(name==='splash') splashTimer=setTimeout(()=>{if(current==='splash')go('scan')},1150);
}
document.addEventListener('click',e=>{const b=e.target.closest('[data-go]');if(b){e.preventDefault();go(b.dataset.go)}});
Promise.all(parts.map(p=>fetch(p,{cache:'force-cache'}).then(r=>{if(!r.ok)throw Error(p);return r.text()})))
.then(chunks=>{
  const url='url("data:image/webp;base64,'+chunks.join('').trim()+'")';
  screens.forEach(s=>s.style.backgroundImage=url);
  const l=document.getElementById('loading');l.classList.add('hide');setTimeout(()=>l.remove(),400);
}).catch(()=>{document.getElementById('loading').innerHTML='<div style="font-size:13px;color:#d8a34f">Cargando VERA…</div>'});
</script>
</body>
</html>

<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#020812"><title>Activar VERA</title><link rel="icon" href="/icon.svg" type="image/svg+xml"><link rel="stylesheet" href="/css/global.css"></head><body class="client-body"><main class="activation-shell"><div class="brand-lockup"><span class="brand-mark">V</span><span><strong>VERA</strong><small>LUBRICANTES</small></span></div><section class="glass-card activation-card"><p class="eyebrow" id="activation-purpose">Acceso VERA</p><h1 id="activation-title">Validando <span>QR</span></h1><p class="muted" id="activation-copy"><span data-fa="spinner" data-fa-class="is-spinning"></span> Comprobando el enlace temporal.</p><form id="activation-form" class="hidden"><label>Nuevo PIN de 4 dígitos<input class="text-input" id="new-pin" type="password" inputmode="numeric" maxlength="4" pattern="[0-9]{4}" required></label><label>Confirmar PIN<input class="text-input" id="confirm-pin" type="password" inputmode="numeric" maxlength="4" pattern="[0-9]{4}" required></label><button class="btn primary" type="submit"><span data-fa="floppy-disk"></span> Guardar PIN</button></form><p class="error-text" id="activation-error"></p><a class="btn hidden" id="go-login" href="/"><span data-fa="right-from-bracket"></span> Ir a VERA</a></section></main><script src="/js/fa-solid-icons.js"></script><script src="/js/vera-ui.js"></script><script src="/js/activate.js" defer></script></body></html>
